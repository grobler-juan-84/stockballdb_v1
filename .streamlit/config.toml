# StockBallDB Explorer — Phase 11D desktop theme (local Streamlit).
# Presentation only; does not affect database semantics.

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#eef2f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
