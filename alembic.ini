# Alembic configuration for StockBallDB.
# The database URL is loaded from the environment (DATABASE_URL), not hardcoded here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Leave empty — overridden in env.py from stockballdb.config / DATABASE_URL
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
