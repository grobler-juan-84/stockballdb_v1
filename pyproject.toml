[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockballdb"
version = "1.0.0"
description = "StockBallDB — historical financial and market-context database foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "SQLAlchemy>=2.0",
    "alembic",
    "psycopg[binary]>=3.0",
    "requests",
    "python-dotenv",
    "pandas_market_calendars==5.4.0",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
